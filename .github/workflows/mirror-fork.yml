name: Mirror to HouseAccountEng fork

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 7 * * 1'   # safety net only; push and dispatch are the real paths

concurrency:
  group: mirror-fork
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-main:
    name: Fast-forward the fork's main
    # Required guard: the fork's main receives this very file once synced.
    if: github.repository == 'claudiob/omen'
    runs-on: ubuntu-latest
    steps:
      - name: merge-upstream HouseAccountEng/omen:main
        env:
          GH_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::FORK_TOKEN is not set"; exit 1; }
          gh api --method POST /repos/HouseAccountEng/omen/merge-upstream \
            -f branch=main --jq '"merge_type=\(.merge_type) \(.message)"'

  sync-pages:
    name: Rebuild the fork's gh-pages
    if: github.repository == 'claudiob/omen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
          path: site

      - name: Rewrite the links and force-push to the fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        working-directory: site
        run: |
          set -euo pipefail
          [ -n "${FORK_TOKEN:-}" ] || { echo "::error::FORK_TOKEN is not set"; exit 1; }

          src_sha="$(git rev-parse HEAD)"

          # Fail loudly if a future page edit changes the link count this was designed against.
          n="$(grep -c 'github\.com/claudiob/omen' index.html || true)"
          [ "$n" -eq 2 ] || { echo "::error::expected 2 upstream links, found $n"; exit 1; }

          sed -i 's|github\.com/claudiob/omen|github.com/HouseAccountEng/omen|g' index.html
          ! grep -q 'github\.com/claudiob/omen' index.html || { echo "::error::rewrite incomplete"; exit 1; }

          # Generated-branch hygiene:
          #  .git, .github  -> gone, so the fork never carries a workflow and the PAT
          #                    never needs Workflows:write for this push
          #  .gitignore     -> gone, so it is not served and cannot make `git add -A` skip files
          #  .nojekyll      -> added, so the Pages build is a plain file copy
          rm -rf .git .github
          rm -f .gitignore
          touch .nojekyll

          git init -q -b gh-pages .
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Mirror claudiob/omen gh-pages@${src_sha}, with this fork's links"
          git push --force \
            "https://x-access-token:${FORK_TOKEN}@github.com/HouseAccountEng/omen.git" \
            gh-pages:refs/heads/gh-pages
